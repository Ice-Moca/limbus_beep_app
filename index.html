<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Limbus Beep - 단테 삐삐 시뮬레이터</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- CRT 스캔라인 오버레이 -->
  <div class="crt-overlay"></div>
  <div class="crt-vignette"></div>

  <!-- 메인 삐삐 인터페이스 전체 영역 (클릭/터치로 다음 단계 진행) -->
  <div id="pager-app" class="pager-container" tabindex="0">
    
    <!-- 삐삐 외곽 네온 테두리 & 모서리 장식 -->
    <div class="terminal-frame">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>
    </div>

    <!-- 상단 상태바 -->
    <header class="pager-header">
      <div class="header-left">
        <span id="stage-badge" class="badge">STAGE 1 / 3</span>
        <span id="msg-badge" class="badge badge-dim">MSG 1 / 2</span>
      </div>
      <div class="header-center">
        <span class="system-title">DANTE PDA PROTOCOL</span>
      </div>
      <div class="header-right">
        <span id="status-badge" class="status-indicator">READY</span>
        <button id="btn-open-settings" class="icon-btn" title="설정 (S)">⚙</button>
      </div>
    </header>

    <!-- 중앙 메인 삐삐 디스플레이 (거대한 픽셀 텍스트) -->
    <main class="pager-screen">
      <div class="screen-content">
        <!-- 1. 상태 서브 라벨 / 비프음 진행 점 (Dots) -->
        <div id="display-dots" class="dots-display"></div>
        <div id="display-sub-label" class="sub-label"></div>

        <!-- 2. 중앙 메인 텍스트 (암호문 / 복호화 텍스트 / _CLEAR._) -->
        <div id="display-main" class="main-text">SPACE 를 눌러 시작</div>

        <!-- 3. 일정 시간 정보 (예: 09:00 - 10:00) -->
        <div id="display-time" class="time-badge"></div>

        <!-- 4. 복호화 진행 바 -->
        <div id="progress-container" class="progress-bar-container">
          <div id="progress-fill" class="progress-bar-fill"></div>
        </div>
      </div>
    </main>

    <!-- 하단 조작 가이드 -->
    <footer class="pager-footer">
      <div class="footer-left">
        <span class="sys-code">LCB-SYS-2.0</span>
      </div>
      <div class="footer-center">
        <span id="hint-text" class="hint-text">[ SPACE / 화면 터치: 진행 ] &nbsp; [ R: 다시 재생 ] &nbsp; [ S: 설정 ]</span>
      </div>
      <div class="footer-right">
        <span id="clock-display" class="clock-text">--:--:--</span>
      </div>
    </footer>

  </div>

  <!-- ⚙️ 깔끔한 환경 설정 모달 팝업 -->
  <div id="settings-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">
          <span class="icon">⚙️</span>
          <span>단테 삐삐 환경 설정</span>
        </div>
        <button id="btn-close-settings" class="close-btn">&times;</button>
      </div>

      <!-- 모달 탭 버튼 바 -->
      <div class="modal-tabs">
        <button class="tab-btn active" data-tab="tab-calendar">📅 캘린더 연동</button>
        <button class="tab-btn" data-tab="tab-messages">📝 메시지 직접 편집</button>
        <button class="tab-btn" data-tab="tab-sound">🔊 사운드 & 화면</button>
      </div>

      <div class="modal-body">
        <!-- 탭 1: Google Calendar 연동 -->
        <div id="tab-calendar" class="tab-pane active">
          <div class="form-group">
            <label for="input-ics-url">Google Calendar 비공개 iCal(ICS) 주소</label>
            <div class="input-with-btn">
              <input type="text" id="input-ics-url" placeholder="https://calendar.google.com/calendar/ical/.../basic.ics">
              <button id="btn-sync-now" class="btn btn-primary">즉시 동기화</button>
            </div>
            <p class="form-help">
              Google 캘린더 웹 접속 > 설정 > 내 캘린더 설정 > <strong>'iCal 형식의 비공개 주소'</strong>를 복사하여 붙여넣으세요.
            </p>
          </div>

          <div class="status-box" id="sync-status-box">
            <div class="status-title">📊 현재 동기화 상태</div>
            <div id="sync-status-msg" class="status-desc">등록된 일정: 기본 3단계 메시지 로드됨</div>
          </div>

          <div class="form-group row-flex">
            <label for="select-auto-sync">자동 동기화 주기</label>
            <select id="select-auto-sync">
              <option value="0">자동 동기화 끄기</option>
              <option value="5">5분마다</option>
              <option value="10">10분마다</option>
              <option value="30">30분마다</option>
              <option value="60" selected>1시간마다</option>
            </select>
          </div>
        </div>

        <!-- 탭 2: 메시지 직접 편집 -->
        <div id="tab-messages" class="tab-pane">
          <p class="form-help">캘린더 연동 대신 원하는 메시지를 직접 단계별로 작성할 수 있습니다.</p>
          
          <div class="stage-editor">
            <div class="form-group">
              <label>STAGE 1 메시지 (줄바꿈으로 구분)</label>
              <textarea id="edit-stage-1" rows="2" placeholder="아침식사&#10;오전 미팅"></textarea>
            </div>
            <div class="form-group">
              <label>STAGE 2 메시지 (줄바꿈으로 구분)</label>
              <textarea id="edit-stage-2" rows="2" placeholder="점심식사&#10;오후 업무"></textarea>
            </div>
            <div class="form-group">
              <label>STAGE 3 메시지 (줄바꿈으로 구분)</label>
              <textarea id="edit-stage-3" rows="2" placeholder="저녁식사&#10;휴식 및 취침"></textarea>
            </div>
          </div>
          <button id="btn-apply-custom-messages" class="btn btn-secondary">작성한 메시지로 적용</button>
        </div>

        <!-- 탭 3: 사운드 & 화면 설정 -->
        <div id="tab-sound" class="tab-pane">
          <div class="form-group">
            <div class="slider-header">
              <label for="slider-volume">비프음 볼륨</label>
              <span id="label-volume">80%</span>
            </div>
            <div class="input-with-btn">
              <input type="range" id="slider-volume" min="0" max="100" value="80" class="slider">
              <button id="btn-test-sound" class="btn btn-secondary">🔊 소리 테스트</button>
            </div>
          </div>

          <div class="form-group row-flex">
            <label for="select-decode-speed">복호화 속도</label>
            <select id="select-decode-speed">
              <option value="fast">빠르게 (0.5초)</option>
              <option value="normal" selected>보통 (0.9초)</option>
              <option value="slow">느리게 (1.5초)</option>
            </select>
          </div>

          <div class="form-group row-flex">
            <label for="toggle-scanlines">CRT 스캔라인 효과</label>
            <input type="checkbox" id="toggle-scanlines" checked class="toggle-checkbox">
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button id="btn-reset-default" class="btn btn-danger">기본값 복원</button>
        <button id="btn-save-settings" class="btn btn-primary">설정 저장 및 닫기</button>
      </div>
    </div>
  </div>

  <!-- 토스트 알림창 -->
  <div id="toast" class="toast hidden"></div>

  <!-- 오디오 소스 -->
  <audio id="beep-audio" src="assets/beep.wav" preload="auto"></audio>

  <script src="app.js"></script>
</body>
</html>
