<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>단테 삐삐</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <!-- CRT 스캔라인 & 비네팅 오버레이 -->
  <div id="crt-overlay" class="crt-overlay"></div>
  <div id="crt-vignette" class="crt-vignette"></div>

  <!-- 메인 삐삐 인터페이스 전체 영역 (클릭/터치로 다음 단계 진행) -->
  <div id="pager-app" class="pager-container" tabindex="0">
    
    <!-- 삐삐 외곽 네온 테두리 & 코너 장식 -->
    <div class="terminal-frame">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>
    </div>

    <!-- 초미니멀 상단 바 (설정 버튼만 우측 상단에 심플하게 배치) -->
    <header class="pager-header">
      <div class="header-left"></div>
      <div class="header-right">
        <button id="btn-open-settings" class="icon-btn" title="설정">SETTING</button>
      </div>
    </header>

    <!-- 중앙 메인 삐삐 디스플레이 (거대한 픽셀 텍스트) -->
    <main class="pager-screen">
      <div class="screen-content">
        <!-- 1. 상태 서브 라벨 / 비프음 진행 점 (Dots) -->
        <div id="display-dots" class="dots-display"></div>
        <div id="display-sub-label" class="sub-label"></div>

        <!-- 2. 중앙 메인 텍스트 (암호문 / 복호화 텍스트 / _CLEAR._) -->
        <div id="display-main" class="main-text">SPACE 를 눌러 시작</div>

        <!-- 3. 일정 시간 정보 (예: 09:00 - 10:00) -->
        <div id="display-time" class="time-badge"></div>

        <!-- 4. 복호화 진행 바 -->
        <div id="progress-container" class="progress-bar-container">
          <div id="progress-fill" class="progress-bar-fill"></div>
        </div>
      </div>
    </main>

    <!-- 초미니멀 하단 바 (우측 시계만 깔끔하게 표시) -->
    <footer class="pager-footer">
      <div class="footer-left"></div>
      <div class="footer-right">
        <span id="clock-display" class="clock-text">--:--:--</span>
      </div>
    </footer>

  </div>

  <!-- 환경 설정 모달 팝업 -->
  <div id="settings-modal" class="modal-overlay hidden">
    <div class="modal-card">
      
      <!-- 모달 헤더 (영어/서브텍스트 제거, 순수 한글 타이틀) -->
      <div class="modal-header">
        <div class="modal-title-group">
          <div class="modal-title">
            <span>환경 설정</span>
          </div>
        </div>
        <button id="btn-close-settings" class="close-btn" title="닫기">&times;</button>
      </div>

      <!-- 세그먼트 탭 네비게이션 -->
      <div class="modal-tabs">
        <button class="tab-btn active" data-tab="tab-calendar">
          <span>캘린더 연동</span>
        </button>
        <button class="tab-btn" data-tab="tab-messages">
          <span>메시지 관리</span>
        </button>
        <button class="tab-btn" data-tab="tab-sound">
          <span>화면 및 사운드</span>
        </button>
      </div>

      <!-- 모달 본문 영역 (작은 설명글 전면 제거) -->
      <div class="modal-body">
        
        <!-- ── 탭 1: 캘린더 연동 ── -->
        <div id="tab-calendar" class="tab-pane active">
          
          <!-- 구글 계정 로그인 카드 -->
          <div class="section-card">
            <div class="section-card-header">
              <span class="card-tag">Google 캘린더 연동</span>
            </div>

            <div class="oauth-action-row">
              <button id="btn-google-login" class="btn btn-google">
                <span class="btn-g-logo">G</span>
                <span id="google-login-text">Google 계정으로 로그인</span>
              </button>
              <button id="btn-google-logout" class="btn btn-danger-outline hidden">연결 해제</button>
            </div>

            <div id="oauth-account-info" class="oauth-account-status hidden">
              <span class="status-dot-active"></span>
              <span id="oauth-account-email">연동 완료</span>
            </div>
          </div>

          <!-- iCal 비공개 URL 연동 -->
          <div class="section-card">
            <div class="section-card-header">
              <span class="card-tag">iCal 비공개 주소 연동</span>
            </div>
            <div class="input-with-btn">
              <input type="text" id="input-ics-url" placeholder="https://calendar.google.com/calendar/ical/.../basic.ics" autocomplete="off" spellcheck="false">
              <button id="btn-sync-now" class="btn btn-primary">동기화</button>
            </div>
          </div>

          <!-- 자동 동기화 주기 -->
          <div class="option-row">
            <div class="option-title">자동 동기화 주기</div>
            <select id="select-auto-sync" class="cyber-select">
              <option value="0">끄기</option>
              <option value="5">5분</option>
              <option value="10">10분</option>
              <option value="30">30분</option>
              <option value="60" selected>1시간</option>
            </select>
          </div>

        </div>

        <!-- ── 탭 2: 메시지 관리 ── -->
        <div id="tab-messages" class="tab-pane">
          
          <div class="messages-top-bar">
            <div class="stage-control-group">
              <span id="label-custom-stage-count" class="stage-count-badge">3 STAGES</span>
              <button id="btn-add-stage" class="btn btn-sm btn-primary">+ 단계 추가</button>
            </div>
            <div class="sample-actions">
              <button id="btn-load-sample" class="btn btn-sm btn-secondary">예시 불러오기</button>
              <button id="btn-clear-messages" class="btn btn-sm btn-danger-outline">비우기</button>
            </div>
          </div>

          <!-- 각 STAGE 카드 컨테이너 -->
          <div id="stage-cards-container" class="stage-cards-scroll">
            <!-- JS에서 렌더링 -->
          </div>

          <button id="btn-apply-custom-messages" class="btn btn-primary btn-block" style="margin-top: 10px;">
            적용하기
          </button>
        </div>

        <!-- ── 탭 3: 화면 및 사운드 설정 ── -->
        <div id="tab-sound" class="tab-pane">
          
          <!-- 화면 설정 -->
          <div class="section-card">
            <div class="section-card-header">
              <span class="card-tag">화면 설정</span>
            </div>

            <!-- 화면 방향 -->
            <div class="option-row">
              <div class="option-title">화면 방향</div>
              <select id="select-orientation" class="cyber-select">
                <option value="landscape" selected>가로 모드 (기본)</option>
                <option value="portrait">세로 모드</option>
                <option value="sensor">자동 회전</option>
              </select>
            </div>

            <!-- 복호화 속도 -->
            <div class="option-row">
              <div class="option-title">복호화 속도</div>
              <select id="select-decode-speed" class="cyber-select">
                <option value="fast">빠르게 (0.5초)</option>
                <option value="normal" selected>보통 (0.9초)</option>
                <option value="slow">느리게 (1.5초)</option>
              </select>
            </div>

            <!-- CRT 스캔라인 -->
            <div class="option-row">
              <div class="option-title">CRT 스캔라인</div>
              <label class="switch">
                <input type="checkbox" id="toggle-scanlines" checked>
                <span class="slider-switch"></span>
              </label>
            </div>

            <!-- CRT 비네팅 -->
            <div class="option-row">
              <div class="option-title">CRT 비네팅</div>
              <label class="switch">
                <input type="checkbox" id="toggle-vignette" checked>
                <span class="slider-switch"></span>
              </label>
            </div>

            <!-- 테마 컬러 -->
            <div class="option-row">
              <div class="option-title">테마 컬러</div>
              <select id="select-theme-color" class="cyber-select">
                <option value="cyan" selected>단테 시안</option>
                <option value="amber">황금가지 앰버</option>
                <option value="green">레트로 그린</option>
              </select>
            </div>
          </div>

          <!-- 사운드 설정 -->
          <div class="section-card">
            <div class="section-card-header">
              <span class="card-tag">사운드 설정</span>
            </div>
            
            <div class="form-group">
              <div class="slider-header">
                <span class="slider-title">볼륨</span>
                <span id="label-volume" class="slider-val">80%</span>
              </div>
              <div class="input-with-btn">
                <input type="range" id="slider-volume" min="0" max="100" value="80" class="cyber-slider">
                <button id="btn-test-sound" class="btn btn-secondary">테스트</button>
              </div>
            </div>

            <div class="option-row" style="margin-top: 10px;">
              <div class="option-title">사운드 종류</div>
              <select id="select-sound-type" class="cyber-select">
                <option value="file" selected>비프 사운드</option>
                <option value="synth">신디사이저 톤</option>
              </select>
            </div>
          </div>

        </div>

      </div>

      <!-- 모달 푸터 액션 버튼 -->
      <div class="modal-footer">
        <button id="btn-reset-default" class="btn btn-danger-outline">초기화</button>
        <div class="footer-right-btns">
          <button id="btn-cancel-settings" class="btn btn-secondary">취소</button>
          <button id="btn-save-settings" class="btn btn-primary">저장</button>
        </div>
      </div>

    </div>
  </div>

  <!-- 토스트 알림창 -->
  <div id="toast" class="toast hidden"></div>

  <!-- 오디오 소스 -->
  <audio id="beep-audio" src="assets/beep.wav" preload="auto"></audio>

  <script src="app.js"></script>
</body>
</html>
